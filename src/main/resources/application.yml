spring:
  application:
    name: booking-api

  # Local defaults match docker-compose.yml. Render (and any other host) supplies
  # the real values through these environment variables.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bookingdb}
    username: ${DB_USERNAME:booking}
    password: ${DB_PASSWORD:booking}

  jpa:
    # validate = Hibernate checks entities against the Flyway-created schema and
    # refuses to start if they disagree. Never use ddl-auto: update on a real project.
    hibernate:
      ddl-auto: validate
    # Closes the persistence context at the end of the service call, not the HTTP
    # response. Forces you to load what you need up front instead of hiding lazy
    # loads in the view layer. Good interview talking point.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  # Render tells the app which port to bind through PORT.
  port: ${PORT:8080}
  # Render terminates HTTPS at its proxy and forwards plain HTTP. Trusting the
  # X-Forwarded-* headers makes generated URLs (Swagger's server URL, Location
  # headers) use https:// instead of http://.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.booking: DEBUG

security:
  jwt:
    # Deliberately obvious dev-only default. Every real deployment MUST set
    # JWT_SECRET; anyone who can read this repo can forge tokens with the default.
    secret: ${JWT_SECRET:ZGV2LW9ubHktand0LXNlY3JldC1uZXZlci11c2UtdGhpcy1vdXRzaWRlLWxvY2FsLWRldiEh}
    issuer: booking-api
    access-token-ttl-seconds: 900      # 15 minutes - short, because it cannot be revoked
    refresh-token-ttl-days: 7          # long, but stored in the DB so it can be revoked

booking:
  # How long a PENDING booking holds its seats before the expiry job releases them.
  hold-minutes: 10
  # OPTIMISTIC (@Version) or PESSIMISTIC (SELECT ... FOR UPDATE). See README.
  locking-strategy: OPTIMISTIC
  expiry-job-interval-ms: 30000
